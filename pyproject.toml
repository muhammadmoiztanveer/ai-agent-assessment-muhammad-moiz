[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-search-intelligence"
version = "1.0.0"
description = "Agentic Search Intelligence System — a LangGraph DAG of atomic agents exposed via a FastAPI JSON API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Muhammad Moiz" }]
keywords = ["langgraph", "langchain", "fastapi", "agents", "dataforseo", "seo"]

dependencies = [
    # --- Orchestration / agents ---
    "langgraph>=1.2,<2",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.6,<2",
    # --- API ---
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.52,<1",
    # --- Validation / config ---
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    # --- Persistence ---
    "SQLAlchemy>=2.0,<3",
    # --- HTTP client ---
    "httpx>=0.28,<1",
    # --- Resilience ---
    "tenacity>=9.1,<10",
    # --- Observability ---
    "structlog>=26.1,<27",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.0,<2",
    "respx>=0.23,<1",
    "ruff>=0.16,<1",
    "black>=26,<27",
    "mypy>=2.3,<3",
]

[project.scripts]
agentic-search = "app.__main__:main"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "frontend*"]

# ----------------------------------------------------------------------------
# Ruff — linting + import sorting
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "RUF", # ruff-specific
]
ignore = [
    "B008", # function calls in argument defaults (FastAPI Depends pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ----------------------------------------------------------------------------
# Black — formatting
# ----------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# ----------------------------------------------------------------------------
# mypy — static typing
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
